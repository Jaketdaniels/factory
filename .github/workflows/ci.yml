# CI: lint -> typecheck -> test (workers pool) -> dry-run, then deploy on main.
# Deploy pattern per https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
# (cloudflare/wrangler-action@v3; CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets).
# The deploy job no-ops until the secrets exist — token minting is dashboard-only,
# so CI is verification-first by default.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        if: env.HAS_CF_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CF_TOKEN == 'true'
      - name: Deploy tariff-watch
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: probes/tariff-watch
      - name: Deploy skipped (no CLOUDFLARE_API_TOKEN secret)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable CI deploys."

  # Publish the MCP server card to the official registry when it changes.
  # Auth is GitHub Actions OIDC (io.github.<owner>/* namespace) — no browser,
  # no stored secret. Commands per modelcontextprotocol/registry docs.
  publish-mcp:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect server.json change
        id: card
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "probes/tariff-watch/server.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mcp-publisher
        if: steps.card.outputs.changed == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Publish to MCP registry
        if: steps.card.outputs.changed == 'true'
        working-directory: probes/tariff-watch
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
