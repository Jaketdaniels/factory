        - heading "Where does the data come from?" [level=3] [ref=e51]
        - paragraph [ref=e52]: "Every entry is an original one-line record of a Federal Register document: USTR, CBP, ITA, ITC, BIS, the Foreign-Trade Zones Board, and presidential tariff documents. US government works are public domain (17 U.S.C. §105)."
      - generic [ref=e53]:
        - heading "What do the statuses mean?" [level=3] [ref=e54]
        - paragraph [ref=e55]: Proposed, final, and effective come from the document type and its stated effective date. Court-driven statuses appear only when pinned to a specific document. The primary source is always one click away.
